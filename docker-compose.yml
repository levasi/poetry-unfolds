# Local PostgreSQL for development. Start: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poetry_unfolds
      POSTGRES_PASSWORD: poetry_unfolds_dev
      POSTGRES_DB: poetry_unfolds
    ports:
      - "5433:5432"
    volumes:
      - poetry_unfolds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poetry_unfolds -d poetry_unfolds"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  poetry_unfolds_pgdata:
